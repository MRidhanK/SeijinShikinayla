<div id="openingScreen">

    <div class="opening-bg"></div>

    <div class="stars-layer"></div>

    <div class="shooting-stars"></div>

    <!-- Moon -->
    <div class="moon"></div>

    <!-- Sakura -->
    <div class="sakura-container"></div>

    <!-- Mist -->
    <div class="mist"></div>

<!-- =========================
     PREMIUM TORII
========================= -->

<div class="torii">

    <!-- Main Torii Structure -->
    <div class="torii-kasagi"></div>

    <div class="torii-shimagi"></div>

    <div class="torii-nuki"></div>

    <div class="torii-gakuzuka"></div>

    <!-- Left Pillar -->
    <div class="torii-pillar torii-pillar-left">

        <div class="pillar-cap"></div>

    </div>

    <!-- Right Pillar -->
    <div class="torii-pillar torii-pillar-right">

        <div class="pillar-cap"></div>

    </div>

    <!-- Lantern Left -->
    <div class="lantern lantern-left">

        <div class="lantern-roof"></div>

        <div class="lantern-body">

            <span>灯</span>

        </div>

        <div class="lantern-bottom"></div>

    </div>

    <!-- Lantern Right -->
    <div class="lantern lantern-right">

        <div class="lantern-roof"></div>

        <div class="lantern-body">

            <span>灯</span>

        </div>

        <div class="lantern-bottom"></div>

    </div>

    <!-- Torii Ground Glow -->
    <div class="torii-ground-glow"></div>

</div>

    <!-- Content -->

    <div class="opening-content">

        <span class="jp-title">

            成人式

        </span>

        <h1>

            Seijin Shiki Ceremony

        </h1>

        <h2>

            Araki Nayla Suji Aurelia

        </h2>

        <p>

            Welcome to the celebration of adulthood

        </p>

        <button id="enterCeremony">

            Enter Ceremony

        </button>

    </div>

    <!-- Audio -->

    <audio id="openingAudio" preload="auto">

        <source
            src="{{ url_for('static', filename='audio/sfx/opening.mp3') }}"
            type="audio/mpeg">

    </audio>

</div>
